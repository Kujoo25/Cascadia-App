name: Docker Image CI

on:
  push:
    branches:
      - docker-image-latest
      - docker-image-test
  pull_request:
    branches:
      - docker-image-latest
      - docker-image-test
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute image name and channel tag
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

          case "$GITHUB_REF" in
            refs/heads/docker-image-latest)
              channel=latest
              ;;
            refs/heads/docker-image-test)
              channel=test
              ;;
            refs/pull/*)
              channel="pr-${{ github.event.pull_request.number }}"
              ;;
            *)
              channel="sha-${GITHUB_SHA::12}"
              ;;
          esac

          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/app.Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/docker-image-latest' || github.ref == 'refs/heads/docker-image-test') }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.channel }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
